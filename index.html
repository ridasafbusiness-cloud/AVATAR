<title>BAC 2027 — Study Center v4</title>
<style>
:root{
  --font-scale:1;
  --bg:#0d0b12;--bg2:#15121c;--surface:#18141f;--surface2:#201a2a;--surface3:#272033;
  --text:#faf7ff;--muted:#a9a1b4;--line:rgba(255,255,255,.10);
  --accent:#9254ff;--accent2:#df4bff;--accent3:#45d7ff;
  --softAccent:rgba(146,84,255,.15);--glow:rgba(146,84,255,.22);
  --ok:#43dc81;--warn:#f6b94c;--bad:#ff667f;--radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-size:calc(16px * var(--font-scale));font-family:"Noto Naskh Arabic","Noto Naskh","Amiri","Traditional Arabic",serif;background:
radial-gradient(circle at 12% 6%,var(--glow),transparent 25%),
radial-gradient(circle at 88% 12%,rgba(223,75,255,.10),transparent 22%),
linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}
body.light{--bg:#f4eff9;--bg2:#ebe4f3;--surface:#ffffff;--surface2:#f6f0fb;--surface3:#ece2f4;--text:#2a2031;--muted:#6e6276;--line:rgba(42,32,49,.12);--softAccent:rgba(146,84,255,.12);--glow:rgba(146,84,255,.16)}
.app{min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topin{max-width:1450px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:45px;height:45px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 34px var(--glow);font-family:system-ui}
.brandtitle{font-weight:900;font-size:calc(18px * var(--font-scale))}.brandsub{font-size:calc(12px * var(--font-scale));color:var(--muted);margin-top:2px}
.topactions{margin-inline-start:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--surface2);padding:9px 12px;border-radius:13px}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px var(--glow);font-weight:900}.btn.danger{color:#ffb6c3;border-color:rgba(255,102,127,.3)}
.shell{max-width:1450px;margin:auto;padding:20px 16px}
.screen{display:none}.screen.active{display:block}
.heroGrid{display:grid;grid-template-columns:1.22fr .88fr;gap:16px}
.hero,.count,.panel{border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 22px 70px rgba(0,0,0,.18)}
.hero{padding:24px;background:linear-gradient(145deg,var(--softAccent),color-mix(in srgb,var(--surface) 94%,transparent))}
.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--softAccent);border:1px solid var(--line);font-size:calc(12px * var(--font-scale))}
.hero h1{font-size:clamp(calc(31px * var(--font-scale)),4vw,calc(54px * var(--font-scale)));line-height:1.07;margin:20px 0 10px}
.hero p{max-width:760px;line-height:1.9;color:var(--muted);font-size:calc(15px * var(--font-scale))}
.heroBtns,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wisdomBox{margin-top:20px;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:17px 18px;box-shadow:0 18px 55px rgba(0,0,0,.12)}
.wisdomBadge{font-size:calc(12px * var(--font-scale));color:color-mix(in srgb,var(--accent) 76%,var(--text));font-weight:900}.wisdomText{font-size:calc(18px * var(--font-scale));font-weight:900;line-height:1.8;margin-top:6px}.wisdomAuthor{font-size:calc(12px * var(--font-scale));color:var(--muted);margin-top:6px}.wisdomSource{font-size:calc(11px * var(--font-scale));color:var(--muted);margin-top:2px}
.count{padding:21px;background:linear-gradient(180deg,var(--surface2),var(--surface))}
.count h3{margin:0 0 10px;font-size:calc(18px * var(--font-scale))}.countHint{font-size:calc(11px * var(--font-scale));color:var(--muted)}
.timegrid{display:grid;grid-template-columns:1.2fr repeat(4,.95fr);gap:7px;margin-top:15px}.time{padding:11px 4px;text-align:center;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.03)}.tn{font-size:clamp(calc(22px * var(--font-scale)),3vw,calc(35px * var(--font-scale)));font-weight:950}.tl{font-size:calc(10px * var(--font-scale));color:var(--muted);margin-top:2px}
.under{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px;color:var(--muted);font-size:calc(11px * var(--font-scale))}
.section{margin-top:20px}.secHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.secTitle{font-size:calc(21px * var(--font-scale));font-weight:950}.secSub{font-size:calc(12px * var(--font-scale));color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}.ml{font-size:calc(11px * var(--font-scale));color:var(--muted)}.mv{font-size:calc(28px * var(--font-scale));font-weight:950;margin-top:4px}
.bar{height:8px;border-radius:99px;background:rgba(127,127,127,.16);overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent3),var(--accent),var(--accent2))}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.q{min-height:92px;padding:14px 8px;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center}.qi{font-size:calc(24px * var(--font-scale))}.qt{font-size:calc(12px * var(--font-scale));font-weight:850;margin-top:5px}
.pageHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.kicker{font-size:calc(11px * var(--font-scale));color:var(--muted)}.title{font-size:calc(31px * var(--font-scale));font-weight:950}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}.search,.field input,.field textarea,.field select{background:var(--surface2);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:11px 12px}.search{flex:1;min-width:220px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:13px}.card{position:relative;overflow:hidden;min-height:180px;padding:16px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,var(--softAccent),var(--surface));transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:0 18px 45px rgba(0,0,0,.14)}.card:after{content:"";position:absolute;right:-65px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.04)}
.ci{font-size:calc(39px * var(--font-scale))}.cn{font-weight:950;font-size:calc(20px * var(--font-scale));margin-top:15px;cursor:text;border-bottom:1px dashed transparent;display:inline-block}.cn:hover{border-bottom-color:var(--accent)}.cm{font-size:calc(11px * var(--font-scale));color:var(--muted);margin-top:5px}.cf{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.tiny{font-size:calc(11px * var(--font-scale));padding:8px 10px;border:1px solid var(--line);background:var(--surface2);border-radius:11px}
.detail{display:grid;grid-template-columns:290px 1fr;gap:13px}.side{border:1px solid var(--line);border-radius:22px;padding:13px;background:var(--surface);height:max-content}.unitList{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.unitBtn{width:100%;text-align:right;padding:12px;border:1px solid transparent;background:transparent;border-radius:15px}.unitBtn.active{background:var(--softAccent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}.unitBtn .unitName{font-weight:850;cursor:text}.unitBtn .unitName:hover{color:var(--accent)}.unitBtn small{display:block;color:var(--muted);font-size:calc(10px * var(--font-scale));margin-top:3px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(127,127,127,.11)}.lesson:last-child{border-bottom:0}.check{width:20px;height:20px;accent-color:var(--accent)}.lname{font-weight:850;cursor:text;border-bottom:1px dashed transparent;display:inline-block}.lname:hover{border-bottom-color:var(--accent)}.lsub{font-size:calc(10px * var(--font-scale));color:var(--muted);margin-top:2px}.status{padding:8px 9px;border-radius:10px;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:calc(11px * var(--font-scale))}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}.s0{background:#7b7f89}.s1{background:#60a5fa}.s2{background:var(--warn)}.s3{background:var(--ok)}.s4{background:var(--accent2)}
.inlineTools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.hint{font-size:calc(11px * var(--font-scale));color:var(--muted)}
.statsTable{border:1px solid var(--line);border-radius:18px;overflow:hidden}.r{display:grid;grid-template-columns:1.2fr .8fr .8fr;padding:11px 12px;border-top:1px solid rgba(127,127,127,.11);font-size:calc(12px * var(--font-scale))}.r.head{border-top:0;background:var(--surface2);color:var(--muted);font-size:calc(10px * var(--font-scale))}
.modalBg{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:14px}.modalBg.show{display:flex}.modal{width:min(800px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:0 30px 100px rgba(0,0,0,.5)}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalTitle{font-size:calc(20px * var(--font-scale));font-weight:950}.field{margin-top:12px}.field label{display:block;font-size:calc(11px * var(--font-scale));color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%}.modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 9px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:15px;padding:7px 2px;font-size:calc(10px * var(--font-scale))}.nav button.active{background:var(--softAccent);color:var(--text)}.nav i{display:block;font-style:normal;font-size:calc(20px * var(--font-scale));line-height:1;margin-bottom:4px}
.toast{position:fixed;right:15px;bottom:93px;z-index:140;display:none;background:var(--surface);border:1px solid var(--line);padding:11px 13px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:320px}.toast.show{display:block}
.empty{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:1050px){.heroGrid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.side{order:2}}
@media(max-width:700px){.shell{padding:13px 11px}.topin{padding:9px 11px}.topactions .btn:not(.primary){display:none}.hero{padding:18px}.count{padding:18px}.metrics{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.timegrid{grid-template-columns:1.15fr repeat(4,.85fr);gap:4px}.time{padding:8px 2px}.tn{font-size:calc(19px * var(--font-scale))}.lesson{grid-template-columns:auto 1fr}.lesson .status{grid-column:2}.pageHead{align-items:start}.title{font-size:calc(26px * var(--font-scale))}}

.reorderHandle{width:30px;height:30px;min-width:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;font-size:15px!important;padding:0}.reorderHandle:active,.reorderHandle.longpressing{cursor:grabbing;background:var(--softAccent);color:var(--accent);box-shadow:0 0 0 3px var(--softAccent)}.reorderTarget{position:relative}.reorderTarget.dropBefore::before,.reorderTarget.dropAfter::after{content:"";position:absolute;left:6px;right:6px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent3),var(--accent),var(--accent2));box-shadow:0 0 14px var(--glow);z-index:25}.reorderTarget.dropBefore::before{top:-3px}.reorderTarget.dropAfter::after{bottom:-3px}.reorderTarget.draggingItem{opacity:.25;transform:scale(.985)}.dragGhost{position:fixed;z-index:5000;pointer-events:none;max-width:min(78vw,440px);padding:10px 15px;border-radius:15px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 22px 60px rgba(0,0,0,.35);backdrop-filter:blur(14px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dragInstruction{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:var(--softAccent);border:1px solid var(--line);padding:5px 8px;border-radius:999px}.subjectCard{--sc:#9254ff;background:radial-gradient(circle at 82% 15%,color-mix(in srgb,var(--sc) 32%,transparent),transparent 34%),linear-gradient(145deg,color-mix(in srgb,var(--sc) 24%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--sc) 38%,var(--line))}.subjectVisual{position:relative;height:92px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 28%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--sc) 26%,transparent);display:flex;align-items:center;justify-content:center}.subjectVisual svg{width:92px;height:92px;stroke:color-mix(in srgb,var(--sc) 78%,white);fill:none;stroke-width:2.5;opacity:.96}.subjectEmoji{position:absolute;right:9px;bottom:7px;font-size:22px!important;filter:drop-shadow(0 5px 12px rgba(0,0,0,.24))}.subjectSpark{position:absolute;width:62px;height:62px;border-radius:50%;background:color-mix(in srgb,var(--sc) 18%,transparent);filter:blur(3px);left:-13px;top:-13px}.fontPreview{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.fontRange{width:100%;accent-color:var(--accent)}.fontSample{font-weight:900;font-size:calc(20px * var(--font-scale));line-height:1.8}@media(max-width:700px){.reorderHandle{width:34px;height:34px;min-width:34px}.subjectVisual{height:82px}.subjectVisual svg{width:80px;height:80px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin">
  <div class="brand"><div class="brandmark">🎓</div><div><div class="brandtitle">BAC 2027 — Study Center</div><div class="brandsub" id="branchLabel"></div></div></div>
  <div class="topactions"><button class="btn" onclick="showScreen('settings')">⚙️</button><button class="btn primary" id="installBtn" style="display:none">📲 تثبيت</button></div>
</div></header>
<main class="shell">
<section id="home" class="screen active"></section>
<section id="subjects" class="screen"></section>
<section id="subject" class="screen"></section>
<section id="stats" class="screen"></section>
<section id="settings" class="screen"></section>
</main>
<nav class="bottom"><div class="nav">
<button class="active" data-s="home"><i>🏠</i>الرئيسية</button>
<button data-s="subjects"><i>📚</i>المواد</button>
<button data-s="stats"><i>📊</i>إحصائيات</button>
<button data-s="settings"><i>⚙️</i>إعدادات</button>
</div></nav>
<div id="modalBg" class="modalBg" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>
<input id="importFile" type="file" accept=".json" style="display:none">
</div>

function init(){

  try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!d){
    let old=null;
    try{old=JSON.parse(localStorage.getItem('bac2027-study-center-pro-v3')||localStorage.getItem('bac2027-study-center-pro-v2')||'null')}catch(e){}
    if(old && old.branchId && old.subjects){
      d={
        version:3,branchId:null,libraries:{management:clone(old.subjects)},
        status:old.status||{},date:old.date||'2027-06-01T08:00:00',

  if(d.branchId && !d.libraries[d.branchId]) d.libraries[d.branchId]=starterForBranch(d.branchId);

function statsSubject(s){
  let total=0,score=0,mastered=0;
  for(const u of s.units||[])for(const l of u.lessons||[]){
    total++;const v=st(s.id,u.id,l.id);score+=meta(v)[1];if(v>=3)mastered++;
  }
  return {total,score,pct:total?Math.round(score*100/total):0,mastered}
}
function statsAll(){
  let total=0,score=0,mastered=0;
  for(const s of state.subjects){const x=statsSubject(s);total+=x.total;score+=x.score;mastered+=x.mastered}
  return {total,score,pct:total?Math.round(score*100/total):0,mastered}
}
function nextLesson(){
  for(const s of state.subjects)for(const u of s.units||[])for(const l of u.lessons||[]){
    const v=st(s.id,u.id,l.id);if(v<4)return{s,u,l,v};
  }
  return null;
}

function monthsAndTime(){
  const target=new Date(state.date),now=new Date();let diff=target-now;if(!isFinite(diff)||diff<0)diff=0;
  let total=Math.floor(diff/1000),days=Math.floor(total/86400);let rem=total%86400;
  const h=Math.floor(rem/3600);rem%=3600;const m=Math.floor(rem/60),sec=rem%60;
  let months=(target.getFullYear()-now.getFullYear())*12+(target.getMonth()-now.getMonth());
  if(target.getDate()<now.getDate())months--; if(months<0)months=0;
  return{months,days,h,m,sec};
}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shiftColor(hex,deg){
  try{
    let[r,g,b]=hexToRgb(hex);const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/510;
    if(max!==min){const d=max-min;s=d/(255-Math.abs(510*l-255));if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
    h=(h+deg)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let rr=0,gg=0,bb=0;
    if(h<60){rr=c;gg=x}else if(h<120){rr=x;gg=c}else if(h<180){gg=c;bb=x}else if(h<240){gg=x;bb=c}else if(h<300){rr=x;bb=c}else{rr=c;bb=x}
    return rgbToHex((rr+m)*255,(gg+m)*255,(bb+m)*255);
  }catch(e){return hex}
}
function applyTheme(){

  root.style.setProperty('--accent',a);root.style.setProperty('--accent2',shiftColor(a,43));root.style.setProperty('--accent3',shiftColor(a,160));
  root.style.setProperty('--softAccent',`color-mix(in srgb,${a} 18%,transparent)`);
  root.style.setProperty('--font-scale',String(state.fontScale||1));
  root.style.setProperty('--glow',`color-mix(in srgb,${a} 25%,transparent)`);
  document.body.classList.toggle('light',state.themeMode==='light');
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',state.themeMode==='light'?'#f4eff9':a);
}

function beginReorderDrag(d){if(dragState!==d)return;d.active=true;d.handle.classList.remove('longpressing');const selector=d.type==='unit'?`.reorderTarget[data-reorder-type="unit"][data-reorder-id="${CSS.escape(d.uid)}"]`:`.reorderTarget[data-reorder-type="lesson"][data-reorder-id="${CSS.escape(d.lid)}"]`;d.item=document.querySelector(selector);if(!d.item){dragState=null;return}d.item.classList.add('draggingItem');d.list=d.type==='unit'?document.getElementById('unitList'):document.getElementById('lessonList');const label=d.type==='unit'?d.item.querySelector('.unitName')?.textContent:d.item.querySelector('.lname')?.textContent;d.ghost=document.createElement('div');d.ghost.className='dragGhost';d.ghost.textContent='↕  '+(label||'تحريك');document.body.appendChild(d.ghost);updateReorderDrag(d.startX,d.startY)}
function updateReorderDrag(x,y){const d=dragState;if(!d?.active)return;d.ghost.style.left=(x+14)+'px';d.ghost.style.top=(y+14)+'px';d.list?.querySelectorAll('.dropBefore,.dropAfter').forEach(el=>el.classList.remove('dropBefore','dropAfter'));const target=document.elementsFromPoint(x,y).find(el=>el.classList?.contains('reorderTarget')&&el!==d.item&&el.parentElement===d.list);if(target){const r=target.getBoundingClientRect();d.overId=target.dataset.reorderId;d.dropBefore=y<r.top+r.height/2;target.classList.add(d.dropBefore?'dropBefore':'dropAfter')}else d.overId=null}
function finishReorderDrag(x,y){const d=dragState;if(!d)return;if(d.active){updateReorderDrag(x,y);if(d.overId&&d.overId!==(d.type==='unit'?d.uid:d.lid)){if(d.type==='unit')applyUnitReorder(d.sid,d.uid,d.overId,d.dropBefore);else applyLessonReorder(d.sid,d.uid,d.lid,d.overId,d.dropBefore)}cleanupReorder(d);return}dragState=null}
function cleanupReorder(d){d.ghost?.remove();d.item?.classList.remove('draggingItem');document.querySelectorAll('.dropBefore,.dropAfter').forEach(el=>el.classList.remove('dropBefore','dropAfter'));dragState=null}
function applyUnitReorder(sid,fromId,toId,before){const s=sub(sid);if(!s)return;const from=s.units.findIndex(x=>x.id===fromId);if(from<0)return;const [item]=s.units.splice(from,1);let idx=s.units.findIndex(x=>x.id===toId);if(idx<0)idx=s.units.length;if(!before)idx++;s.units.splice(Math.min(Math.max(idx,0),s.units.length),0,item);save();selectedUnit=item.id;render('subject');toast('تم نقل الوحدة ↕️')}
function applyLessonReorder(sid,uid2,fromId,toId,before){const u=sub(sid)?.units.find(x=>x.id===uid2);if(!u)return;const from=u.lessons.findIndex(x=>x.id===fromId);if(from<0)return;const [item]=u.lessons.splice(from,1);let idx=u.lessons.findIndex(x=>x.id===toId);if(idx<0)idx=u.lessons.length;if(!before)idx++;u.lessons.splice(Math.min(Math.max(idx,0),u.lessons.length),0,item);save();render('subject');toast('تم نقل الدرس ↕️')}
function addLesson(sid,uid2){const s=sub(sid),u=s?.units.find(x=>x.id===uid2);if(!u)return;const n=prompt('اسم الدرس الجديد:');if(!n)return;u.lessons.push({id:uid('l'),name:n.trim()});save();render('subject');toast('أضيف الدرس ✅')}
function renameLesson(sid,uid2,lid){const u=sub(sid)?.units.find(x=>x.id===uid2),l=u?.lessons.find(x=>x.id===lid);if(!l)return;const v=prompt('اسم الدرس:',l.name);if(v===null)return;l.name=v.trim()||l.name;save();render('subject');toast('تم تعديل اسم الدرس ✏️')}
function removeLesson(sid,uid2,lid){const u=sub(sid)?.units.find(x=>x.id===uid2);if(!u)return;const l=u.lessons.find(x=>x.id===lid);if(!l||!confirm(`حذف «${l.name}»؟`))return;u.lessons=u.lessons.filter(x=>x.id!==lid);delete state.status[`${state.branchId}::${sid}::${uid2}::${lid}`];save();render('subject');}
function reorderLesson(sid,uid2,lid){const u=sub(sid)?.units.find(x=>x.id===uid2),i=u?.lessons.findIndex(x=>x.id===lid);if(!u||i<0)return;const d=prompt(`ترتيب الدرس:\\n1 أعلى · 2 أسفل · 3 موضع محدد`,'1');if(d==='1'&&i>0)[u.lessons[i],u.lessons[i-1]]=[u.lessons[i-1],u.lessons[i]];else if(d==='2'&&i<u.lessons.length-1)[u.lessons[i],u.lessons[i+1]]=[u.lessons[i+1],u.lessons[i]];else if(d==='3'){const p=Number(prompt(`الموضع (1-${u.lessons.length})`,String(i+1)));if(isFinite(p)&&p>=1&&p<=u.lessons.length){const [x]=u.lessons.splice(i,1);u.lessons.splice(p-1,0,x)}}else return;save();render('subject');toast('تم ترتيب الدروس ↕️')}
function mark(s,u,l,checked){state.status[`${state.branchId}::${s}::${u}::${l}`]=checked?3:0;save();render('subject')}
function setStatus(s,u,l,v){state.status[`${state.branchId}::${s}::${u}::${l}`]=Number(v);save();render('subject')}
function openLesson(s,u,l){selectedSubject=s;selectedUnit=u;setStatus(s,u,l,Math.max(1,st(s,u,l)));showScreen('subject')}

  <div class="section panel"><div class="statsTable"><div class="r head"><div>المادة</div><div>الدروس</div><div>التقدم</div></div>${state.subjects.map(s=>{const x=statsSubject(s);return`<div class="r"><div>${esc(s.icon||'📚')} ${esc(s.name)}</div><div>${x.mastered}/${x.total}</div><div>${x.pct}%</div></div>`}).join('')}</div></div>`

  document.getElementById('settings').innerHTML=`<div class="pageHead"><div><div class="kicker">⚙️ الإعدادات</div><div class="title">تحكم كامل</div></div></div>
  <div class="cards">
    <div class="panel"><h3>🎓 الشعبة</h3><div class="note">${state.branchId?esc(branch().name):'لم تُختر بعد'}</div><button class="btn" style="margin-top:10px" onclick="branchEditor()">تغيير الشعبة</button></div>
    <div class="panel"><h3>🎨 المظهر</h3><div class="note">${state.themeMode==='light'?'فاتح':'داكن'} · اللون ${esc(state.accent)}</div><button class="btn primary" style="margin-top:10px" onclick="themeEditor()">اختيار المظهر</button></div>

    <div class="panel"><h3>♻️ البداية</h3><div class="note">استعادة المحتوى المبدئي للشعبة الحالية فقط.</div><button class="btn danger" style="margin-top:10px" onclick="restoreBranch()">استعادة الخريطة الأصلية</button></div>

function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),2400)}

function setupBranch(){
  branchEditor(true);
}
function branchEditor(first=false){
  modal(`<div class="modalHead"><div><div class="modalTitle">🎓 اختر شعبتك</div><div class="note">اختر شعبة حقيقية، ثم عدّل المنهج داخلها كما تريد ليتطابق مع برنامج مؤسستك.</div></div>${first?'':'<button class="btn" onclick="closeModal()">✕</button>'}</div>
  <div class="cards" style="margin-top:13px">${BRANCHES.map(b=>`<button class="card" style="text-align:right" onclick="chooseBranch('${b.id}')"><div class="ci">${b.icon}</div><div class="cn">${esc(b.name)}</div><div class="cm">${esc(b.desc)}</div></button>`).join('')}</div>`)
}
function chooseBranch(id){
  if(state.branchId&&state.branchId!==id) state.libraries[state.branchId]=state.subjects;
  state.branchId=id;
  if(!state.libraries[id]) state.libraries[id]=starterForBranch(id);
  state.subjects=state.libraries[id];
  state.setupDone=true;save();closeModal();render('home');toast(`تم اختيار ${branch().name} ✅`)
}

function themeEditor(){modal(`<div class="modalHead"><div><div class="modalTitle">🎨 مظهر التطبيق</div><div class="note">اختيار اللون يغير هوية الواجهة كاملة، وحجم الخط يطبق على نصوص التطبيق.</div></div><button class="btn" onclick="closeModal()">✕</button></div><div class="row" style="margin-top:12px"><button class="btn ${state.themeMode==='dark'?'primary':''}" onclick="setMode('dark')">🌙 داكن</button><button class="btn ${state.themeMode==='light'?'primary':''}" onclick="setMode('light')">☀️ فاتح</button></div><div class="field"><label>لون التطبيق</label><input id="picker" type="color" value="${esc(state.accent)}" style="height:54px;padding:4px"></div><div class="field"><label>حجم الخط</label><div class="fontPreview"><button class="btn" onclick="nudgeFont(-0.05)">A−</button><input id="fontRange" class="fontRange" type="range" min="0.85" max="1.30" step="0.05" value="${Number(state.fontScale||1).toFixed(2)}" oninput="previewFont(this.value)"><button class="btn" onclick="nudgeFont(0.05)">A+</button><span id="fontPct" class="note">${Math.round((state.fontScale||1)*100)}%</span></div><div class="fontSample" style="margin-top:7px">مثال على شكل النص داخل التطبيق.</div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="setColor('#9254ff')">🟣 بنفسجي</button><button class="btn" onclick="setColor('#e94c9f')">🌸 وردي</button><button class="btn" onclick="setColor('#3b82f6')">🔵 أزرق</button><button class="btn" onclick="setColor('#10b981')">🟢 أخضر</button><button class="btn" onclick="setColor('#f59e0b')">🟠 برتقالي</button><button class="btn" onclick="setColor('#ef4444')">🔴 أحمر</button></div><div class="modalActions"><button class="btn" onclick="previewFont(1)">↺ 100%</button><button class="btn primary" onclick="saveTheme()">💾 حفظ المظهر</button></div>`)}
function previewFont(v){const n=Math.min(1.30,Math.max(.85,Number(v)||1));document.documentElement.style.setProperty('--font-scale',String(n));const p=document.getElementById('fontPct');if(p)p.textContent=Math.round(n*100)+'%';const r=document.getElementById('fontRange');if(r)r.value=n}
function nudgeFont(delta){const c=Number(document.getElementById('fontRange')?.value||state.fontScale||1);previewFont((Math.round((c+delta)*20)/20).toFixed(2))}
function setMode(v){state.themeMode=v;save();themeEditor()}
function setColor(v){state.accent=v;save();themeEditor()}
function saveTheme(){const v=document.getElementById('picker')?.value;if(v)state.accent=v;state.fontScale=Number(document.getElementById('fontRange')?.value||state.fontScale||1);save();closeModal();render(document.querySelector('.screen.active').id);toast('تم حفظ المظهر 🎨')}
function countdownEditor(){
  modal(`<div class="modalHead"><div><div class="modalTitle">⏳ تاريخ البكالوريا</div><div class="note">يمكن تغييره من هنا في أي وقت.</div></div><button class="btn" onclick="closeModal()">✕</button></div>
  <div class="field"><label>التاريخ والوقت</label><input id="datePicker" type="datetime-local" value="${new Date(state.date).toISOString().slice(0,16)}"></div>
  <div class="modalActions"><button class="btn primary" onclick="saveDate()">حفظ</button></div>`)
}
function saveDate(){const v=document.getElementById('datePicker').value;if(!v)return;state.date=new Date(v).toISOString();save();closeModal();render('home');toast('تم تحديث العداد ✅')}

function contactDeveloper(){

    <a class="card" href="https://t.me/aizen_sr1" target="_blank" rel="noopener"><div class="ci">✈️</div><div class="cn">Telegram</div><div class="cm">t.me/aizen_sr1</div></a>

function restoreBranch(){
  if(!state.branchId)return;
  if(!confirm('استعادة الخريطة المبدئية للشعبة الحالية؟ ستُحذف تعديلاتك على ترتيب/أسماء/إضافات هذه الشعبة.'))return;
  state.subjects=starterForBranch(state.branchId);save();render('subjects');toast('تمت استعادة الخريطة الأصلية ✅')
}
function backup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='bac2027-study-center-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير النسخة الاحتياطية ✅')
}
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!d.libraries||!d.version)throw 0;
      state=d;state.version=3;save();render('home');toast('تم استيراد النسخة ✅')
    }catch(_){alert('ملف النسخة الاحتياطية غير صالح.')}
  };r.readAsText(f);e.target.value='';
}
function contact(){contactDeveloper()}

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installBtn').style.display='inline-block'});
document.getElementById('installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;}else toast('استخدم قائمة Chrome ثم «تثبيت التطبيق» عندما يظهر الخيار.')};
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));

applyTheme();
render('home');
if(!state.setupDone)setTimeout(()=>setupBranch(),200);
setInterval(()=>{if(document.getElementById('home').classList.contains('active'))home()},1000);
</script>
